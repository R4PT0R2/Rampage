<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>RAMPAGE — Главная</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Навбар */
    .navbar {
      display: flex;
      gap: 30px;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      position: relative;
      transition: 0.3s;
    }

    .navbar a:hover {
      color: #ff3b3b;
    }

    .navbar a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0%;
      height: 2px;
      background: #ff3b3b;
      transition: 0.3s;
    }

    .navbar a:hover::after {
      width: 100%;
    }

    /* Логотип */
    .logo-anim {
      width: 260px;
      display: block;
      margin: 80px auto 20px;
      animation: pulse 3s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.7));
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.4)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 25px rgba(255, 0, 0, 1)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.4)); }
    }

    h1 {
      text-align: center;
      font-size: 40px;
      color: #ff3b3b;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
    }

    /* Частицы */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 50, 50, 0.8);
      border-radius: 50%;
      animation: float 6s infinite linear;
    }

    @keyframes float {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120vh); opacity: 0; }
    }

    /* Музыка */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #ff3b3b;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <!-- Частицы -->
  <div class="particles" id="particles"></div>

  <!-- Меню -->
  <nav class="navbar">
    <a href="index.html">Главная</a>
    <a href="about.html">О клане</a>
    <a href="history.html">История</a>
    <a href="rules.html">Правила</a>
  </nav>

  <!-- Логотип -->
  <img src="assets/logo.png" class="logo-anim">

  <h1>Клан RAMPAGE</h1>

  <!-- Музыка -->
  <button class="music-btn" onclick="toggleMusic()">🎵 Музыка</button>

  <audio id="bgm" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* Частицы */
    const container = document.getElementById('particles');
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDuration = 4 + Math.random() * 6 + 's';
      p.style.opacity = Math.random();
      container.appendChild(p);
    }

    /* Музыка */
    let playing = false;
    function toggleMusic() {
      const audio = document.getElementById("bgm");
      if (!playing) {
        audio.play();
        playing = true;
      } else {
        audio.pause();
        playing = false;
      }
    }
  </script>

</body>
</html>
