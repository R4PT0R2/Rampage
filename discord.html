<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Discord — RAMPAGE Clan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #3b0000 0, #050509 55%, #000 100%);
      color: #fff;
      overflow-x: hidden;
    }

    /* Частицы */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 50, 50, 0.8);
      border-radius: 50%;
      animation: float 6s infinite linear;
    }
    @keyframes float {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120vh); opacity: 0; }
    }

    header {
      padding: 24px 8vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      box-shadow: 0 0 18px rgba(255, 59, 59, 0.7);
    }
    .logo-text {
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: 14px;
    }

    nav {
      display: flex;
      gap: 18px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    nav a { color: #fff; opacity: 0.8; text-decoration: none; }
    nav a:hover { opacity: 1; }

    main {
      padding: 40px 8vw 80px;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    iframe {
      margin-top: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
    }

    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #ff3b3b;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <header>
    <div class="logo">
      <img src="assets/1.png" alt="logo">
      <div class="logo-text">RAMPAGE CLAN</div>
    </div>

    <nav>
      <a href="index.html">Главная</a>
      <a href="about.html">О клане</a>
      <a href="history.html">История</a>
      <a href="rules.html">Правила</a>
      <a href="discord.html">Discord</a>
    </nav>
  </header>

  <main>
    <h1>Наш Discord</h1>

    <iframe src="https://discord.com/widget?id=1304099145413558282&theme=dark"
            width="350"
            height="500"
            allowtransparency="true"
            frameborder="0"
            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>
  </main>

  <button class="music-btn" onclick="toggleMusic()">🎵 Музыка</button>
  <audio id="bgm" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDuration = 4 + Math.random() * 6 + 's';
      p.style.opacity = Math.random();
      container.appendChild(p);
    }

    let playing = false;
    function toggleMusic() {
      const audio = document.getElementById("bgm");
      if (!playing) {
        audio.play();
        playing = true;
      } else {
        audio.pause();
        playing = false;
      }
    }
  </script>

</body>
</html>
